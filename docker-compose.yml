version: '3.8'

services:
  backend:
    build:
      context: ../taller-calendar-api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../taller-calendar-api/.env.local

  frontend:
    build:
      context: ../taller-calendar-front
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ../taller-calendar-front/.env.local
    depends_on:
      - backend
